# YOLOv8n-P2 消融变体：仅新增 P2 小目标检测头，Neck 保持原生 C2f。
# 用于与 baseline(yolov8n.yaml) 对比，单独验证小目标检测层的贡献。

nc: 3
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]        # cat backbone P4
  - [-1, 3, C2f, [512]]              # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # cat backbone P3
  - [-1, 3, C2f, [256]]              # 15 (P3/8-small)

  # 新增：P2 高分辨率检测层
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16: P3 上采样至 4 倍下采样
  - [[-1, 2], 1, Concat, [1]]        # 17: cat backbone P2(索引2)
  - [-1, 3, C2f, [128]]              # 18 (P2/4-small)

  # 自 P3 下行，重建 P4、P5
  - [-1, 1, Conv, [128, 3, 2]]       # 19: P2 -> 8 倍下采样
  - [[-1, 15], 1, Concat, [1]]       # 20: cat head P3
  - [-1, 3, C2f, [256]]              # 21 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]       # 22
  - [[-1, 12], 1, Concat, [1]]       # 23: cat head P4
  - [-1, 3, C2f, [512]]              # 24 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]       # 25
  - [[-1, 9], 1, Concat, [1]]        # 26: cat head P5
  - [-1, 3, C2f, [1024]]             # 27 (P5/32)

  - [[18, 21, 24, 27], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)