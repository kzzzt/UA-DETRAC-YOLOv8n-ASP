# YOLOv8n-ASP 改进模型配置
# =====================
# A (Attention)  : SimAM 无参注意力，接在每个检测头特征图之后、Detect 之前
# S (Small-object): 新增 P2 小目标检测层（4 倍下采样、160x160 @ 640）
# P (P2 head)     : 与 S 一并体现在本配置的 head 结构
# E (EIOU)        : 在 scripts/train.py 中通过 --eiou 启用（损失层，非结构）
#
# SimAM 采用「独立层」接入（见 models/simam.py），不改变通道/分辨率，
# 可直接被 ultralytics 通用解析路径构建；需先导入 models 包以注册 SimAM
# （train.py / eval.py / visualize.py 会自动处理）。

nc: 3   # number of classes: car, bus, van
scales:
  n: [0.33, 0.25, 1024]   # depth, width, max_channels

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]        # cat backbone P4
  - [-1, 3, C2f, [512]]              # 12 (P4 neck)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # cat backbone P3
  - [-1, 3, C2f, [256]]              # 15 (P3/8-small neck)

  # 新增：P2 高分辨率检测层
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16: P3 上采样至 4 倍下采样
  - [[-1, 2], 1, Concat, [1]]        # 17: cat backbone P2(索引2)
  - [-1, 3, C2f, [128]]              # 18 (P2/4-small 检测特征)

  # 自 P2 下行，重建 P3、P4、P5 检测特征
  - [-1, 1, Conv, [128, 3, 2]]       # 19: P2 -> 8 倍下采样
  - [[-1, 15], 1, Concat, [1]]       # 20: cat head P3
  - [-1, 3, C2f, [256]]              # 21 (P3/8 检测特征)

  - [-1, 1, Conv, [256, 3, 2]]       # 22
  - [[-1, 12], 1, Concat, [1]]       # 23: cat head P4
  - [-1, 3, C2f, [512]]              # 24 (P4/16 检测特征)

  - [-1, 1, Conv, [512, 3, 2]]       # 25
  - [[-1, 9], 1, Concat, [1]]        # 26: cat head P5
  - [-1, 3, C2f, [1024]]             # 27 (P5/32 检测特征)

  # SimAM 无参注意力：接在每个检测头特征图之后（不参与下行链，避免二次加权）
  - [18, 1, SimAM, []]               # 28 (P2 attention)
  - [21, 1, SimAM, []]               # 29 (P3 attention)
  - [24, 1, SimAM, []]               # 30 (P4 attention)
  - [27, 1, SimAM, []]               # 31 (P5 attention)

  - [[28, 29, 30, 31], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)
